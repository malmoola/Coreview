name: build

# Tauri does not support cross-compiling Windows bundles from Linux, so each
# platform is built on its own runner. Linux produces .deb and AppImage;
# Windows produces the NSIS .exe and the MSI.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # One workspace now, so one cache and one target/ at the repo root.
      - uses: Swatinem/rust-cache@v2

      # The probe crate is Tauri-free, so it needs none of the GTK stack.
      # src-tauri does; on Windows nothing extra is required.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config \
            iputils-ping

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      # generate_context! validates that frontendDist exists, so the web build
      # has to happen before any cargo command that expands it.
      - name: Build frontend
        run: npm run build

      - name: Probe crate tests
        run: cargo test -p coreview-probe

      # Live tests run real ping processes against 127.0.0.1 and the RFC 5737
      # documentation range. Loopback is available on both runners; the
      # documentation range is expected to time out, which is the point.
      - name: Probe crate live tests
        run: cargo test -p coreview-probe --test live_linux -- --test-threads=1

      - name: Backend tests
        run: cargo test -p coreview

      # Findings are echoed as annotations as well as logged. A failure here is
      # otherwise only visible by downloading the job log, which needs admin
      # rights on the repository — so a red tick said "Clippy failed" and
      # nothing more. The one that prompted this was an import used only by
      # Linux-only tests, invisible on the Linux runner.
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt; then
            grep -E "(warning|error)(\[|:)" clippy.txt | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

  bundle:
    name: bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: coreview-linux
            paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            artifact: coreview-windows
            paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config \
            xdg-utils

      - run: npm ci

      # Signs when a certificate is configured, and quietly does not when it is
      # not, so forks and pull requests still build.
      - name: Prepare code signing
        if: matrix.os == 'windows-latest'
        uses: ./.github/actions/sign-windows
        with:
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # The Windows installer carries a WebView2 *bootstrapper* rather than the
      # runtime itself: embedding the runtime put it in both the NSIS exe and
      # the MSI and took the artifact past 500 MB, for a 7.8 MB application.
      # WebView2 ships with Windows 11 and with Edge on Windows 10, so the
      # bootstrapper almost never has anything to fetch. A machine with no
      # internet *and* no WebView2 needs
      # bundle.windows.webviewInstallMode = offlineInstaller instead.
      #
      # rusqlite is built with `bundled`, so there is no external SQLite.
      - name: Build bundles
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  # A second Windows installer that carries the WebView2 runtime instead of
  # fetching it, for machines with no internet at install time. It is ~500 MB
  # against 7 MB, which is why it is not the default: the runtime ships with
  # Windows 11 and with Edge on Windows 10, so almost every machine already has
  # it and would be downloading a browser engine it is not going to use.
  #
  # Its own job rather than a second target in `bundle`, so the default
  # installer is never held up or failed by this one.
  bundle-windows-offline:
    name: bundle (windows, offline installer)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      # Node rather than a heredoc: it is already on the runner from
      # setup-node, and it reads the file the same way Tauri will.
      - name: Embed the WebView2 runtime
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.bundle.windows.webviewInstallMode = { type: 'offlineInstaller' };
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "
          grep -A2 webviewInstallMode src-tauri/tauri.conf.json

      - name: Prepare code signing
        uses: ./.github/actions/sign-windows
        with:
          certificate: ${{ secrets.WINDOWS_CERTIFICATE }}
          password: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Build bundles
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: coreview-windows-offline
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Does the AppImage carry WebKit, or does it quietly rely on the build host
  # having it? That is the claim worth testing, and the only one an AppImage
  # actually makes: the format deliberately excludes the graphics stack,
  # because libGL is driver-coupled and bundling it breaks acceleration on the
  # host. So the container gets a minimal *desktop* runtime — X, GL, fonts,
  # the things any real machine has — and pointedly NOT libwebkit2gtk-4.1-0,
  # libgtk-3-0 or anything -dev. If the app starts, it started on its own
  # WebKit.
  #
  # The first version of this job installed nothing but xvfb and expected the
  # app to run, which no desktop application could have done.
  appimage-smoke:
    name: AppImage on a machine without WebKit
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coreview-linux
          path: dist-artifacts

      - name: Launch under a bare container
        run: |
          find dist-artifacts -name '*.AppImage' -exec chmod +x {} \;
          APPIMAGE=$(find dist-artifacts -name '*.AppImage' | head -1)
          test -n "$APPIMAGE" || { echo "no AppImage in the artifact"; exit 1; }
          echo "testing $APPIMAGE"
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -eux -c '
            apt-get update -qq
            # A minimal desktop runtime. No FUSE package: --appimage-extract
            # does not use FUSE, and 24.04 renamed it libfuse2t64 anyway, which
            # is what broke the first version of this job.
            apt-get install -y -qq --no-install-recommends               xvfb ca-certificates               libgl1 libegl1 libgbm1 libdrm2               libx11-6 libx11-xcb1 libxcb1 libxrandr2 libxi6               libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 fonts-dejavu-core
            # Prove the host really has no WebKit of its own.
            ! ldconfig -p | grep -q libwebkit2gtk || { echo "host already has WebKit; test proves nothing"; exit 1; }
            chmod +x '"$APPIMAGE"'
            '"$APPIMAGE"' --appimage-extract >/dev/null
            # WebKitGTK will not realise its window without these where there
            # is no GPU; verified locally, where it otherwise sits at an
            # unmapped 10x10 placeholder and prints nothing at all.
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            export LIBGL_ALWAYS_SOFTWARE=1
            # Keep the output: a smoke test that cannot say why it failed is
            # not worth having.
            timeout 40 xvfb-run -a ./squashfs-root/AppRun >/tmp/app.log 2>&1 &
            PID=$!
            sleep 25
            if kill -0 $PID 2>/dev/null; then
              echo "AppImage stayed up for 25s using its own bundled WebKit"
              kill $PID
            else
              echo "AppImage exited early; its output was:"
              cat /tmp/app.log || true
              exit 1
            fi
          '
