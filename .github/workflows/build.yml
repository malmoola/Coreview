name: build

# Tauri does not support cross-compiling Windows bundles from Linux, so each
# platform is built on its own runner. Linux produces .deb and AppImage;
# Windows produces the NSIS .exe and the MSI.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # One workspace now, so one cache and one target/ at the repo root.
      - uses: Swatinem/rust-cache@v2

      # The probe crate is Tauri-free, so it needs none of the GTK stack.
      # src-tauri does; on Windows nothing extra is required.
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config \
            iputils-ping

      - run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      # generate_context! validates that frontendDist exists, so the web build
      # has to happen before any cargo command that expands it.
      - name: Build frontend
        run: npm run build

      - name: Probe crate tests
        run: cargo test -p livetopo-probe

      # Live tests run real ping processes against 127.0.0.1 and the RFC 5737
      # documentation range. Loopback is available on both runners; the
      # documentation range is expected to time out, which is the point.
      - name: Probe crate live tests
        run: cargo test -p livetopo-probe --test live_linux -- --test-threads=1

      - name: Backend tests
        run: cargo test -p livetopo

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  bundle:
    name: bundle (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: livetopo-linux
            paths: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            artifact: livetopo-windows
            paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/msi/*.msi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential curl wget file pkg-config \
            xdg-utils

      - run: npm ci

      # WebView2 is bundled into the installer rather than downloaded at install
      # time — see bundle.windows.webviewInstallMode in tauri.conf.json. rusqlite
      # is built with `bundled`, so there is no external SQLite either. The
      # result should install on a machine with no runtime prerequisites.
      - name: Build bundles
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  # The AppImage claims to carry its own dependencies. This checks that claim on
  # a clean container that has none of the dev libraries installed.
  appimage-smoke:
    name: AppImage on a clean container
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: livetopo-linux
          path: dist-artifacts

      - name: Launch under a bare container
        run: |
          find dist-artifacts -name '*.AppImage' -exec chmod +x {} \;
          APPIMAGE=$(find dist-artifacts -name '*.AppImage' | head -1)
          test -n "$APPIMAGE" || { echo "no AppImage in the artifact"; exit 1; }
          echo "testing $APPIMAGE"
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -eux -c '
            apt-get update -qq
            # Only what is needed to unpack the image and fake a display.
            # No FUSE package: --appimage-extract does not use FUSE, and the
            # 24.04 name changed to libfuse2t64 anyway, which is what broke the
            # first run of this job — apt failed, and -e killed the script
            # before the AppImage was ever started.
            apt-get install -y -qq --no-install-recommends xvfb ca-certificates
            chmod +x '"$APPIMAGE"'
            '"$APPIMAGE"' --appimage-extract >/dev/null
            # WebKitGTK will not realise its window without these in a headless
            # container with no GPU; verified locally, where the app otherwise
            # sits there with an unmapped 10x10 placeholder and no error.
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            export LIBGL_ALWAYS_SOFTWARE=1
            # Keep the output: a smoke test that cannot say why it failed is
            # not worth having.
            timeout 40 xvfb-run -a ./squashfs-root/AppRun >/tmp/app.log 2>&1 &
            PID=$!
            sleep 25
            if kill -0 $PID 2>/dev/null; then
              echo "AppImage stayed up for 25s on a clean image"
              kill $PID
            else
              echo "AppImage exited early on a clean image; its output was:"
              cat /tmp/app.log || true
              exit 1
            fi
          '
