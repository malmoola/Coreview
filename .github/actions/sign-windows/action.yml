name: Prepare Windows code signing
description: >
  Imports the signing certificate and points the Tauri bundler at it. Does
  nothing when no certificate secret is configured, so forks and pull requests
  still build.

inputs:
  certificate:
    description: The signing certificate as a base64-encoded PFX. Empty skips signing.
    required: false
    default: ''
  password:
    description: Password for the PFX.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The thumbprint is read back from the imported certificate rather than
    # kept as a constant, so replacing the certificate needs no change here.
    - name: Import the signing certificate
      shell: pwsh
      env:
        WINDOWS_CERTIFICATE: ${{ inputs.certificate }}
        WINDOWS_CERTIFICATE_PASSWORD: ${{ inputs.password }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
          # A notice rather than a log line: downloading a job log needs admin
          # rights on the repository, and annotations do not, so whether this
          # ran is visible to anyone who can see the run.
          Write-Host "::notice title=Code signing::No certificate configured - this installer is UNSIGNED."
          exit 0
        }

        $pfx = "$env:RUNNER_TEMP\coreview-signing.pfx"
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
        $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
        $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
        # The key is in the store now; the file is not needed and must not be
        # left on the runner's disk.
        Remove-Item $pfx -Force

        Write-Host "::notice title=Code signing::Signing as $($cert.Subject) - thumbprint $($cert.Thumbprint)"

        node .github/actions/sign-windows/configure.mjs "$($cert.Thumbprint)"
